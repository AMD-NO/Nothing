mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:53
  default-nameserver:
    - 223.6.6.6
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 114.114.115.115
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

proxy-providers:
  Quinn:
    type: http
    url: "https://sub.xyz"
    path: ./providers/Quinn.yaml
    interval: 25920000
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600
      lazy: true
    override:
      udp: true
      proxy-name:
        # 去除国旗 emoji（区域指示符）
        - pattern: "[🇦-🇿]{2}"
          target: ""
        # 原 Clash.ini 重命名规则
        - pattern: "^"
          target: "IEPL "

  Darderi:
    type: http
    url: "https://sub.xyz"
    path: ./providers/Darderi.yaml
    interval: 25920000
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600
      lazy: true
    override:
      udp: true
      proxy-name:
        # 去除国旗 emoji
        - pattern: "[🇦-🇿]{2}"
          target: ""
        # 原 Clash.ini 重命名规则
        - pattern: "狮城"
          target: "新加坡"
        - pattern: "伦敦"
          target: "英国"
        - pattern: "(澳洲|悉尼)"
          target: "澳大利亚"

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - HKG
      - TWN
      - SGP
      - JPN
      - USA
      - EURO
      - LAME
      - OCEA

  - name: HKG
    type: select
    include-all: true
    filter: "(香港|HK|Hong Kong)"

  - name: TWN
    type: select
    include-all: true
    filter: "(台湾|TW|Taiwan)"

  - name: SGP
    type: select
    include-all: true
    filter: "(新加坡|SG|Singapore)"

  - name: JPN
    type: select
    include-all: true
    filter: "(日本|JP|Japan)"

  - name: USA
    type: select
    include-all: true
    filter: "(美国|US|United States)"

  - name: Sooka
    type: select
    include-all: true
    filter: "(马来西亚|MY|Malaysia|新加坡|SG|Singapore)"

  - name: Emby
    type: select
    proxies:
      - HKG
      - TWN
      - SGP
      - JPN
      - USA
      - EURO
      - LAME
      - OCEA
      - DIRECT

  - name: Netflix
    type: select
    proxies:
      - HKG
      - TWN
      - SGP
      - JPN
      - USA
      - EURO
      - LAME
      - OCEA

  - name: Disney+
    type: select
    proxies:
      - HKG
      - TWN
      - SGP
      - JPN
      - USA
      - EURO
      - LAME
      - OCEA

  - name: YouTube
    type: select
    proxies:
      - HKG
      - TWN
      - SGP
      - JPN
      - USA
      - EURO
      - LAME
      - OCEA

  - name: Telegram
    type: select
    proxies:
      - HKG
      - TWN
      - SGP
      - JPN
      - USA
      - EURO
      - LAME
      - OCEA

  - name: EURO
    type: select
    include-all: true
    filter: "(英国|United Kingdom|法国|France|荷兰|Netherlands|爱尔兰|Ireland|比利时|Belgium|卢森堡|Luxembourg|德国|Germany|波兰|Poland|瑞士|Switzerland|奥地利|Austria|匈牙利|Hungary|捷克|Czech|斯洛伐克|Slovakia|斯洛文尼亚|Slovenia|克罗地亚|Croatia|西班牙|Spain|希腊|Greece|意大利|Italy|葡萄牙|Portugal|塞尔维亚|Serbia|保加利亚|Bulgaria|罗马尼亚|Romania|丹麦|Denmark|挪威|Norway|冰岛|Iceland|芬兰|Finland|瑞典|Sweden|俄罗斯|Russia|乌克兰|Ukraine|立陶宛|Lithuania|拉脱维亚|Latvia|爱沙尼亚|Estonia)"

  - name: LAME
    type: select
    include-all: true
    filter: "(阿根廷|Argentina|巴西|Brazil|智利|Chile|墨西哥|Mexico|哥伦比亚|Colombia|哥斯达黎加|Costa Rica|秘鲁|Peru|乌拉圭|Uruguay|玻利维亚|Bolivia|厄瓜多尔|Ecuador|危地马拉|Guatemala)"

  - name: OCEA
    type: select
    include-all: true
    filter: "(澳大利亚|AU|Australia|新西兰|NZ|New Zealand)"

